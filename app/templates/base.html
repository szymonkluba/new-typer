<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Typer{% endblock %} - Ski Jumping Bets</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo">Typer</a>
            <div class="nav-links">
                <a href="/competitions">Competitions</a>
                <a href="/ranking">Ranking</a>
                {% if user %}
                    <a href="/bets/my">My Bets</a>
                    <span class="nav-user">{{ user.username }}</span>
                    <a href="/auth/logout" class="btn btn-sm">Logout</a>
                {% else %}
                    <a href="/auth/login" class="btn btn-sm">Login</a>
                    <a href="/auth/register" class="btn btn-sm btn-primary">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="container">
        <p>Typer &mdash; Ski Jumping Betting App</p>
    </footer>
</body>
</html>
